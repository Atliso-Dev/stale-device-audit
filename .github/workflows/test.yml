name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Check script metadata and syntax
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\Atliso-StaleDeviceAudit.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          Test-ScriptFileInfo -Path .\Atliso-StaleDeviceAudit.ps1 | Select-Object Name, Version, Guid
      - name: Run Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
